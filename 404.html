<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Deygo Josy | Piste Introuvable (404)</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="icon" href="images/favicon.webp" type="image/webp">
    
    <!-- Typographie -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        .error-page { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; }
        .error-code { font-family: var(--font-heading); font-size: clamp(6rem, 15vw, 12rem); line-height: 1; color: var(--color-primary); opacity: 0.1; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }
        .error-content { position: relative; z-index: 1; padding: 0 5%; }
        .error-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap; }
    </style>
</head>
<body class="loading">

    <div class="noise-overlay" aria-hidden="true"></div>

    <main class="error-page">
        <div class="error-code">404</div>
        <div class="error-content fade-up">
            <span class="section-label">Erreur</span>
            <h2>Piste introuvable</h2>
            <p style="color: var(--color-text-muted); max-width: 400px; margin: 0 auto;">Ce morceau ne fait pas partie du projet. Le lien que vous avez suivi est obsolète ou a été déplacé.</p>
            
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
                <a href="index.html#discographie" class="btn btn-outline">Écouter la musique</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
